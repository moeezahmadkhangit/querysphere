# Render Blueprint — deploy both Node services in one click.
#
#   render.com -> New -> Blueprint -> pick this repo
#
# The frontend is NOT here: it is a static Vite build and goes on Vercel with
# the custom domain. Only these two need a real server.
#
# Free-plan hours: a free Render account gets 750 instance-hours a month, shared
# across every free service. That is enough for ONE service to stay up around
# the clock (~730h), which is why only the backend runs the keep-alive pinger —
# it holds the live sockets, and a spin-down disconnects everyone. mlend is
# stateless and is left to sleep; the cost is a slow first Format/Summarize
# after an idle spell. To keep
# mlend warm too, add KEEP_ALIVE_INTERVAL_MS to it — and expect to outrun the
# free hours, so put one of the two on a paid instance.

services:
  - type: web
    name: querysphere-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    # Every push to the tracked branch redeploys. This is Render's default; it
    # is written down so that turning it off is a visible decision.
    autoDeploy: true
    envVars:
      # Generated once by Render and never printed in the repo. The value in
      # .env.example is public and must not be used in production.
      - key: JWT_SECRET
        generateValue: true
      # Encrypts message bodies and email addresses in the store file on disk.
      # Generated separately from JWT_SECRET so the signing key can be rotated
      # without making every stored message unreadable.
      #
      # Render's free plan has no persistent disk: the store file lives in the
      # container's ephemeral filesystem, so it survives a process restart but
      # NOT a redeploy or a spin-down. That is the free tier's limit, not a bug
      # here — attach a disk on a paid instance and point DATA_DIR at it for
      # history that outlives a deploy.
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      # Origins allowed by CORS and the socket.io handshake. Comma-separated,
      # no trailing slashes. List every hostname the frontend answers on —
      # Vercel serves it at <project>.vercel.app as well as at the custom
      # domain, and requests from an unlisted origin are rejected:
      #   https://querysphere.moeezahmadkhan.com,https://querysphere.vercel.app
      - key: FRONTEND_URL
        sync: false
      # Self-ping cadence, and the switch that turns the pinger on at all.
      # Render idles a free service out after ~15 minutes without traffic.
      #
      # Setting this ONLY here is what keeps mlend asleep. The pinger used to
      # start by itself wherever RENDER_EXTERNAL_URL existed — which is every
      # Render service — so both stayed up around the clock and burned about
      # 1460 of the workspace's 750 free instance-hours a month.
      #
      # A self-ping cannot recover from a spin-down that has already happened.
      # .github/workflows/keep-alive.yml pings from outside for that case.
      - key: KEEP_ALIVE_INTERVAL_MS
        value: "300000"
      # KEEP_ALIVE_URL is not needed here: Render injects RENDER_EXTERNAL_URL.

  - type: web
    name: querysphere-mlend
    runtime: node
    plan: free
    rootDir: mlend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      # Same comma-separated origin list as the backend.
      - key: FRONTEND_URL
        sync: false
